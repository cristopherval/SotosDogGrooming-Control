<!-- Rubber ball in the logo's pink, drifting up behind the welcome screen. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <radialGradient id="pink" cx=".34" cy=".28" r=".85">
      <stop offset="0" stop-color="#FFC2DC"/>
      <stop offset=".55" stop-color="#F074A8"/>
      <stop offset="1" stop-color="#CE3D7B"/>
    </radialGradient>
    <clipPath id="pinkClip"><circle cx="20" cy="20" r="19"/></clipPath>
  </defs>
  <circle cx="20" cy="20" r="19" fill="url(#pink)"/>
  <!-- a single band around the middle, like a classic dog ball -->
  <path d="M-2 16c13 5 31 5 44 0" clip-path="url(#pinkClip)" fill="none"
        stroke="#fff" stroke-width="3" opacity=".8"/>
  <ellipse cx="13.5" cy="11" rx="5.6" ry="3.9" fill="#fff" opacity=".6"
           transform="rotate(-28 13.5 11)"/>
</svg>

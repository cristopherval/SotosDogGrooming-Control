# Mantiene despierto el proyecto de Supabase (plan gratuito).
#
# Supabase pausa un proyecto gratuito tras 7 dias sin actividad. Este workflow
# hace una consulta de SOLO LECTURA a la base cada 2 dias, aunque nadie abra la
# app, y eso reinicia el contador.
#
# SEGURIDAD DE LOS DATOS: la peticion es un GET con `limit=1`. No escribe, no
# borra y no modifica nada — ni registros, ni fotos, ni el esquema. Ademas usa
# la clave anon, que por RLS ni siquiera puede leer filas (devuelve []). Aun
# asi la consulta se ejecuta dentro de Postgres, que es lo que cuenta como
# actividad.
#
# Ademas, al final escribe la fecha en .github/keepalive-last-run.txt y la
# commitea. Eso mantiene "activo" el repositorio, porque GitHub desactiva los
# workflows programados tras 60 dias sin commits. Ese commit toca UNICAMENTE
# ese archivo de fecha — nunca los archivos de la app.
name: Supabase keep-alive

on:
  schedule:
    # 12:00 UTC los dias 1, 3, 5, ... de cada mes (cada 2 dias).
    - cron: '0 12 */2 * *'
  # Permite lanzarlo a mano desde la pestana Actions para probarlo.
  workflow_dispatch:

# Necesario para poder commitear el archivo de fecha del ultimo ping.
permissions:
  contents: write

# Evita que dos ejecuciones simultaneas peleen al hacer push.
concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Lee la URL y la clave anon de js/config.js para no duplicarlas aqui:
      # si algun dia cambian en la app, este workflow las sigue automaticamente.
      - name: Leer configuracion de Supabase
        id: cfg
        run: |
          url=$(grep -oP "SUPABASE_URL\s*=\s*'\K[^']+" js/config.js)
          key=$(grep -oP "SUPABASE_ANON_KEY\s*=\s*'\K[^']+" js/config.js)
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::error::No se pudo leer SUPABASE_URL / SUPABASE_ANON_KEY de js/config.js"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Ping (solo lectura) a la base de datos
        env:
          URL: ${{ steps.cfg.outputs.url }}
          KEY: ${{ steps.cfg.outputs.key }}
        run: |
          # 3 intentos por si hay un fallo puntual de red.
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' \
              --max-time 30 \
              "$URL/rest/v1/vaccine_catalog?select=id&limit=1" \
              -H "apikey: $KEY" \
              -H "Authorization: Bearer $KEY")
            echo "Intento $i -> HTTP $code"
            # 200 = consulta ejecutada (aunque RLS devuelva []); eso ya despierta la base.
            if [ "$code" = "200" ]; then
              echo "Proyecto Supabase activo. Respuesta: $(cat /tmp/resp.txt)"
              exit 0
            fi
            cat /tmp/resp.txt || true
            sleep 15
          done
          echo "::error::El ping fallo 3 veces. Revisa si el proyecto esta pausado en supabase.com."
          exit 1

      # Un commit periodico evita que GitHub desactive este workflow por
      # "repositorio inactivo" a los 60 dias. Solo corre si el ping salio bien.
      #
      # OJO: se hace `git add` de UN SOLO archivo por su ruta exacta. Nunca usa
      # `git add .`, asi que es imposible que arrastre cambios de la app.
      - name: Registrar la fecha del ultimo ping
        run: |
          STAMP_FILE=.github/keepalive-last-run.txt
          echo "Ultimo ping correcto a Supabase: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > "$STAMP_FILE"

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$STAMP_FILE"

          if git diff --staged --quiet; then
            echo "Sin cambios que commitear."
            exit 0
          fi

          git commit -m 'chore: keep-alive de Supabase [skip ci]'

          # Si alguien mas hizo push mientras corriamos, reintegramos y reintentamos.
          for i in 1 2 3; do
            if git push; then
              echo "Fecha registrada."
              exit 0
            fi
            echo "Push rechazado (intento $i); reintegrando cambios remotos..."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          done
          echo "::error::No se pudo guardar la fecha del keep-alive tras 3 intentos."
          exit 1
